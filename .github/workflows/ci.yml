name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_COLOR: "1"

jobs:
  check:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0 # exact tags only (no v10); caches by default on GitHub's runners
        with:
          cache-suffix: ${{ github.job }} # one cache per job, so parallel jobs don't race to save the same key
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: API types match the API
        run: |
          pnpm gen:types
          git diff --exit-code -- packages/shared-types \
            || (echo "::error::packages/shared-types is out of date. Run 'pnpm gen:types' and commit the result." && exit 1)

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: ${{ github.job }}
      - run: uv run --directory apps/api pytest

  postgres:
    name: Migrations on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Production runs on Postgres; the tests use SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bide_followup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bide_followup
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: ${{ github.job }}
      - name: Migrate up
        run: uv run alembic upgrade head
      - name: Models match the migrations
        run: uv run alembic check
      - name: Migrate down and up again
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: Demo seed loads
        run: uv run python -m bide_followup.seed --demo

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: ${{ github.job }}
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @bide-followup/web exec playwright install --with-deps chromium
      - run: pnpm build:web

      # The same set-up as local development with the mock services (see README), the API serving the built app.
      - name: Database and demo data
        run: pnpm seed:mock
      - name: Start the mocks and the API
        run: |
          mkdir -p logs
          nohup pnpm dev:mocks > logs/mocks.log 2>&1 &
          WEB_DIST_DIR=$PWD/apps/web/dist nohup pnpm dev:api:mock > logs/api.log 2>&1 &
          for url in http://localhost:8400/inbox http://localhost:8300/api/health; do
            for i in $(seq 1 60); do curl -sf "$url" > /dev/null && break; sleep 1; done
            curl -sf "$url" > /dev/null || (echo "::error::$url didn't start" && exit 1)
          done

      - name: Playwright
        run: pnpm --filter @bide-followup/web e2e
        env:
          E2E_BASE_URL: http://localhost:8300

      # The API and mocks run under uv; left running, they hold uv's cache lock and setup-uv's clean-up waits forever.
      - name: Stop the servers
        if: always()
        run: pkill -f "uv run|uvicorn" || true

      - name: Keep the report and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            logs
          retention-days: 7
