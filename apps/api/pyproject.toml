[project]
name = "bide-followup-api"
version = "0.1.0"
description = "Bide Meeting Follow-up API, worker and pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.19",
    "anthropic>=1.5.0",
    "apscheduler>=3.11,<4",
    "cryptography>=45",
    "fastapi>=0.141",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "slack-sdk>=3.36",
    "sqlalchemy>=2.0.52",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bide_followup"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
